<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1024px;height:500px;overflow:hidden}
body{
  background:#0A0A0F;
  font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  display:flex;align-items:center;justify-content:center;gap:56px;padding:0 70px;position:relative;
}
/* brand glow, kept well inside the frame so cropping never clips a hard edge */
.glow{position:absolute;width:760px;height:760px;left:-190px;top:-130px;border-radius:50%;
  background:radial-gradient(circle,rgba(124,58,237,.30) 0%,rgba(0,212,255,.12) 42%,transparent 68%)}
.glow2{position:absolute;width:620px;height:620px;right:-170px;bottom:-230px;border-radius:50%;
  background:radial-gradient(circle,rgba(224,64,251,.22) 0%,transparent 66%)}
.icon{position:relative;flex:none;width:188px;height:188px;border-radius:44px;
  background:linear-gradient(135deg,#00D4FF 0%,#7C3AED 52%,#E040FB 100%);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 22px 60px rgba(124,58,237,.42)}
.icon svg{width:188px;height:188px}
.copy{position:relative}
h1{font-size:82px;line-height:1;font-weight:800;letter-spacing:.11em;
  background:linear-gradient(90deg,#00D4FF 0%,#8B5CF6 48%,#E040FB 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:20px}
p{font-size:29px;line-height:1.32;color:#D8D8E8;font-weight:500;letter-spacing:-.01em}
.tags{display:flex;gap:12px;margin-top:26px}
.tag{font-size:18px;font-weight:600;color:#9A9AB4;border:1px solid #2E2E3E;
  border-radius:999px;padding:8px 17px;letter-spacing:.01em}
</style></head><body>
<div class="glow"></div><div class="glow2"></div>

<div class="icon">
  <svg viewBox="0 0 108 108">
    <path d="M43,49V40A11,11 0,0 1,65,40V49" fill="none" stroke="#F0F0FF" stroke-width="7"/>
    <path d="M54,62L54,44A18,18 0,1 0,69.59,53.00Z" fill="#F0F0FF"/>
    <path d="M54,62L54,44A18,18 0,0 1,69.59,53.00Z" fill="#F0F0FF" fill-opacity=".3"/>
  </svg>
</div>

<div class="copy">
  <h1>SINOPE</h1>
  <p>Two-factor codes that never<br>leave your device.</p>
  <div class="tags">
    <span class="tag">No account</span>
    <span class="tag">No internet</span>
    <span class="tag">Open source</span>
  </div>
</div>
</body></html>
